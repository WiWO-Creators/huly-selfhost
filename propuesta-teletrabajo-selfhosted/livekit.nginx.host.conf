# PROPUESTA — NO APLICADA. Bloque del nginx DEL HOST (el de apt, el que
# termina el TLS), no el del contenedor.
#
# Destino: /etc/nginx/sites-available/livekit.wiwo.me.conf
#          y un symlink en /etc/nginx/sites-enabled/
#
# ============================================================================
# ATENCION: ESTE BLOQUE VA EN UN ARCHIVO NUEVO Y SEPARADO. NO SE PEGA DENTRO
# DE nginx.conf.
#
# nginx.sh reescribe nginx.conf con sed sobre el archivo entero:
#
#     sed -i "s|server_name .*;|server_name ${HOST_ADDRESS};|" ./nginx.conf
#     sed -i "s|proxy_pass .*;|proxy_pass http://${HTTP_BIND:-127.0.0.1}:${HTTP_PORT};|" ./nginx.conf
#
# No son sustituciones acotadas al primer server: pisan TODOS los server_name
# y TODOS los proxy_pass del archivo. Si este bloque viviera ahi, la proxima
# vez que alguien corra ./nginx.sh —por ejemplo al cambiar HOST_ADDRESS— el
# WebSocket de LiveKit quedaria apuntando al front de Huly y con el server_name
# de ops.wiwo.me. Sintoma: nadie puede entrar a una sala y nada en el log de
# LiveKit lo explica.
# ============================================================================
#
# El bloque `location /_love` NO esta aca: es identico al de la opcion Cloud y
# vive en propuesta-teletrabajo/huly.nginx.love.conf, que va dentro de
# .huly.nginx (el nginx del contenedor). Los dos hacen falta:
#   - /_love  -> el servicio love de Huly, dentro de huly_net
#   - este    -> la señalizacion del SFU, que corre en la red del host

# Nombre propio para no chocar con un $connection_upgrade que pueda existir en
# otro archivo del mismo nginx: dos `map` con el mismo nombre es un error de
# arranque, y el nginx del host se queda sin recargar.
map $http_upgrade $lk_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name livekit.wiwo.me;

    # Renovacion del certificado. Ajustar el root al webroot que ya usa el
    # certificado de ops.wiwo.me; se averigua con:
    #   sudo grep -E 'authenticator|webroot_path' /etc/letsencrypt/renewal/*.conf
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Sin http2 a proposito: nginx no implementa WebSocket sobre HTTP/2
    # (RFC 8441). Los navegadores abren igual una conexion HTTP/1.1 para el
    # WebSocket, asi que h2 no aporta nada aca y solo agrega una variable mas
    # a un camino que tiene que ser aburrido.
    listen 443 ssl;
    server_name livekit.wiwo.me;

    ssl_certificate     /etc/letsencrypt/live/livekit.wiwo.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.wiwo.me/privkey.pem;
    # Descomentar si el resto del despliegue ya los incluye (los pone certbot):
    #include /etc/letsencrypt/options-ssl-nginx.conf;
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # 7880 escucha SOLO en loopback (livekit.yaml, bind_addresses).
        # Este proxy es la unica forma de llegar a la señalizacion desde
        # afuera, y por eso el TLS de LiveKit es el mismo del dominio.
        proxy_pass http://127.0.0.1:7880;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        # $lk_connection_upgrade y no el literal "upgrade": mismo bug que ya
        # esta documentado en .huly.nginx:1-7. Ademas del WebSocket, por aca
        # pasan las llamadas HTTP del RoomService que hace `love`
        # (twirp sobre POST); con el valor fijo llegarian como si fueran un
        # handshake.
        proxy_set_header Connection $lk_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La señalizacion es un WebSocket que vive toda la reunion. Con el
        # default de 60s, nginx corta las conexiones de quien esta escuchando
        # sin hablar y el participante se cae solo.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# Aplicar:
#   sudo ln -s /etc/nginx/sites-available/livekit.wiwo.me.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo nginx -s reload
#
# Verificar:
#   curl -i https://livekit.wiwo.me/        -> 200 con el cuerpo "OK"
# 502 = el contenedor livekit no esta arriba o 7880 no quedo en loopback.
# 200 con "Not Ready" = el nodo arranco pero todavia no reporta estadisticas;
# esperar unos segundos y repetir.
