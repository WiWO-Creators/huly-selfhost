name: Deploy Config → ops.wiwo.me

on:
  push:
    branches: [main]
    paths:
      - 'compose.yml'
      - 'compose.testops.yml'
      - 'setup.sh'
      - 'nginx.sh'
      - '.huly.nginx'
  workflow_dispatch:

concurrency:
  group: deploy-ops-config
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_OPS }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST_OPS }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync config files
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --include='compose.yml' \
            --include='compose.testops.yml' \
            --include='setup.sh' \
            --include='nginx.sh' \
            --include='.huly.nginx' \
            --exclude='*' \
            ./ ${{ secrets.SSH_USER_OPS }}@${{ secrets.SSH_HOST_OPS }}:/root/huly-selfhost/

      - name: Redeploy containers
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER_OPS }}@${{ secrets.SSH_HOST_OPS }} << 'DEPLOY'
              set -e
              cd /root/huly-selfhost
              bash nginx.sh
              docker compose -f compose.yml -f compose.testops.yml up -d < /dev/null

              # `up -d` no estaba recreando front ni account pese a cambiar sus
              # variables de entorno, así que la política de acceso no llegaba a
              # aplicarse. Se fuerza la recreación de esos dos.
              docker compose -f compose.yml -f compose.testops.yml up -d \
                --force-recreate front account < /dev/null

              # nginx resuelve las IPs de los upstream al arrancar y las cachea:
              # tras recrear front y account apunta a IPs que ya no existen y
              # devuelve 502. Hay que reiniciarlo después, siempre.
              docker compose -f compose.yml -f compose.testops.yml restart nginx < /dev/null

              # Diagnóstico: sin SSH, esta es la única forma de ver qué quedó
              # realmente aplicado. El `< /dev/null` es obligatorio: los comandos
              # que leen stdin se comen el resto del heredoc del ssh.
              echo "--- contenedores en ejecución:"
              docker ps --format '{{.Names}}\t{{.Image}}' < /dev/null | grep -E "front|account" || true
              echo "--- variables del contenedor account:"
              docker compose -f compose.yml -f compose.testops.yml exec -T account env < /dev/null \
                | grep -E "HIDE_LOCAL_LOGIN|DISABLE_SIGNUP|ALLOWED_EMAIL_DOMAINS" || true
              echo "--- variables del contenedor front:"
              docker compose -f compose.yml -f compose.testops.yml exec -T front env < /dev/null \
                | grep -E "HIDE_LOCAL_LOGIN|DISABLE_SIGNUP" || true

              echo "✅ Config deployed and containers restarted"
          DEPLOY
