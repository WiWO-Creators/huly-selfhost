HULY_VERSION=v0.6.501
DOCKER_NAME=huly

# Frontend image. The Neo theme lives in the source fork
# (github.com/WiWO-Creators/wiwo.ops-front), so the `front` service runs an image
# built from it instead of the upstream prebuilt one. See guides/neo-theme.md.
# Leave unset to fall back to the stock upstream frontend.
FRONT_IMAGE=wiwo/front:latest

# The address of the host or server from which you will access your Huly instance.
# This can be a domain name (e.g., huly.example.com) or an IP address (e.g., 192.168.1.1).
HOST_ADDRESS=localhost:8080

# Set this variable to 'true' to enable SSL (HTTPS/WSS). 
# Leave it empty to use non-SSL (HTTP/WS).
SECURE=

# Specify the IP address to bind to; leave blank to bind to all interfaces (0.0.0.0).
# Do not use IP:PORT format in HTTP_BIND or HTTP_PORT.
HTTP_PORT=8080
HTTP_BIND=

# Huly specific variables
TITLE=WiWO Ops
DEFAULT_LANGUAGE=en
LAST_NAME_FIRST=true

# Google OAuth (login con Google). Descomentar las dos líneas y pegar las
# credenciales para habilitarlo; comentadas, el login queda solo con correo.
# No dejarlas definidas y vacías: el servicio account no arrancaría.
# Ver guides/google-oauth.md.
#GOOGLE_CLIENT_ID=
#GOOGLE_CLIENT_SECRET=
GOOGLE_DISPLAY_NAME=Google

# Acceso solo con Google, restringido por dominio. Descomentar las tres para
# cerrar el acceso local, y solo después de comprobar que Google funciona:
# con las credenciales mal puestas nadie podría entrar.
# Ver guides/google-oauth.md.
#ALLOWED_EMAIL_DOMAINS=wiwo.me,mgcglobalgroup.com
#HIDE_LOCAL_LOGIN=true
#DISABLE_SIGNUP=true

# Sincronización con Google Calendar (servicio "calendar" del compose).
# JSON del cliente OAuth en UNA sola línea y sin comillas externas. Es un
# cliente distinto del de GOOGLE_CLIENT_ID: otros permisos y otra URI de
# redirección. Sin esta variable el servicio "calendar" no arranca.
# Ver guides/google-calendar.md.
#CALENDAR_CREDENTIALS={"web":{"client_id":"...","project_id":"...","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","client_secret":"...","redirect_uris":["https://ops.wiwo.me/_calendar/signin/code"]}}

# Redpanda variables
REDPANDA_ADMIN_USER=superadmin
REDPANDA_ADMIN_PWD=panda_secret

# CockroachDB variables
CR_DATABASE=defaultdb
CR_USERNAME=selfhost
CR_USER_PASSWORD=cr_secret

# Docker volume paths - specify custom paths for persistent data storage
# Leave empty to use default Docker named volumes
VOLUME_ELASTIC_PATH=
VOLUME_FILES_PATH=
VOLUME_CR_DATA_PATH=
VOLUME_CR_CERTS_PATH=
VOLUME_REDPANDA_PATH=

# Invitaciones permanentes de cada espacio de trabajo. Las ofrece la pantalla de
# ingreso a quien todavia no pertenece a ninguno. Se generan una sola vez con:
#   node bundle.js invitacion -t "$HULY_TOKEN"   (herramienta perfex-clients)
OPS_INVITE_MGC=
OPS_INVITE_PALTA=
OPS_INVITE_WIWO=
OPS_INVITE_SIN_CLASIFICAR=

# The following configs are auto-generated by the setup script. 
# Please do not manually overwrite.

# Run with --secret to regenerate.
SECRET=example_secret_key_here
