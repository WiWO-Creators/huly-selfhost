# PROPUESTA — NO APLICADA. Reemplaza el bloque comentado de .huly.nginx:65-76.
#
# Va dentro del `server { ... }` que ya existe, entre los demas /_*. Este archivo
# no es un conf de nginx valido por si solo: es el fragmento a pegar.
#
# Un solo cambio respecto del bloque comentado que trae el repo:
# `Connection $connection_upgrade` en lugar del literal "upgrade". El motivo ya
# esta explicado arriba de todo en .huly.nginx:1-7 — con el valor fijo, los POST
# normales llegan al backend como si fueran un handshake de WebSocket y los
# rechaza con 400. El servicio love es express y casi todo lo que recibe son POST
# normales: /getToken, /startRecord, /stopRecord, /transcription, /language y el
# webhook de LiveKit (services/love/src/main.ts:105-253). Con el bloque original,
# entrar a una sala fallaria con 400 en /getToken.
#
# Aplicar (con aprobacion previa y ./backup-create.sh hecho):
#   1. descomentar/reemplazar el bloque en .huly.nginx
#   2. docker compose restart nginx
#   3. curl -i https://ops.wiwo.me/_love/checkRecordAvailable   -> 200 con `false`

    location /_love {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        rewrite ^/_love(/.*)$ $1 break;
        proxy_pass http://love:8096/;
    }

# Nota: el nginx del host (nginx.conf, generado por nginx.sh y fuera de git) no
# necesita ningun cambio. Solo reenvia todo el dominio al puerto publicado por el
# contenedor nginx, y este archivo es el que decide las rutas internas.
